openapi: 3.0.1
info:
  title: Employee Service API
  description: |-
    CRUD and search for employees.

    1. Request a token with POST /auth/token (admin or reader).
    2. Click "Authorize" and paste the accessToken.

    Dates use the format dd-MM-yyyy. GET endpoints need the READER or ADMIN role; POST, PUT and DELETE need ADMIN.
  version: 1.0.0
security:
- bearerAuth: []
paths:
  /employees/{id}:
    get:
      tags:
      - Employees
      summary: Get an employee by id
      operationId: findById
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "404":
          description: Employee not found
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiError'
        "403":
          description: Role not allowed
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiError'
        "401":
          description: Missing or invalid token
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiError'
        "400":
          description: Invalid input
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiError'
    put:
      tags:
      - Employees
      summary: Update some or all fields of an employee
      description: Fields that are not sent keep their current value. An empty string
        clears middleName or secondLastName.
      operationId: update
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmployeeUpdateRequest'
        required: true
      responses:
        "404":
          description: Employee not found
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiError'
        "403":
          description: Role not allowed
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiError'
        "409":
          description: Duplicate or concurrent update
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiError'
        "401":
          description: Missing or invalid token
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiError'
        "400":
          description: Invalid input
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiError'
    delete:
      tags:
      - Employees
      summary: Delete an employee
      operationId: delete
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "204":
          description: Employee deleted
        "404":
          description: Employee not found
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiError'
        "403":
          description: Role not allowed
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiError'
        "401":
          description: Missing or invalid token
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiError'
        "400":
          description: Invalid input
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiError'
  /employees:
    get:
      tags:
      - Employees
      summary: List all employees
      operationId: findAll
      responses:
        "403":
          description: Role not allowed
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiError'
        "401":
          description: Missing or invalid token
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiError'
        "400":
          description: Invalid input
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiError'
    post:
      tags:
      - Employees
      summary: Create one or several employees
      description: Send a single object or an array of up to 100. The whole request
        is rejected if any item is invalid or duplicated.
      operationId: create
      requestBody:
        content:
          application/json:
            schema:
              maxItems: 100
              minItems: 0
              type: array
              items:
                $ref: '#/components/schemas/EmployeeRequest'
        required: true
      responses:
        "201":
          description: Employees created
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EmployeeResponse'
        "403":
          description: Role not allowed
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiError'
        "409":
          description: Employee already registered
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiError'
        "401":
          description: Missing or invalid token
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiError'
        "400":
          description: Invalid input
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiError'
  /auth/token:
    post:
      tags:
      - Authentication
      summary: Get an access token
      operationId: token
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRequest'
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/TokenResponse'
  /employees/search:
    get:
      tags:
      - Employees
      summary: Search employees by name
      description: "Case-insensitive partial match on first name, middle name and\
        \ both last names."
      operationId: search
      parameters:
      - name: name
        in: query
        required: true
        schema:
          maxLength: 50
          minLength: 2
          type: string
      responses:
        "403":
          description: Role not allowed
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiError'
        "401":
          description: Missing or invalid token
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiError'
        "400":
          description: Invalid input
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiError'
components:
  schemas:
    EmployeeUpdateRequest:
      type: object
      properties:
        firstName:
          maxLength: 50
          minLength: 0
          pattern: "^\\s*\\p{L}+(?:[ '\\-]\\p{L}+)*\\s*$"
          type: string
        middleName:
          maxLength: 50
          minLength: 0
          pattern: "^\\s*$|^\\s*\\p{L}+(?:[ '\\-]\\p{L}+)*\\s*$"
          type: string
        lastName:
          maxLength: 50
          minLength: 0
          pattern: "^\\s*\\p{L}+(?:[ '\\-]\\p{L}+)*\\s*$"
          type: string
        secondLastName:
          maxLength: 50
          minLength: 0
          pattern: "^\\s*$|^\\s*\\p{L}+(?:[ '\\-]\\p{L}+)*\\s*$"
          type: string
        age:
          maximum: 100
          minimum: 18
          type: integer
          format: int32
        gender:
          type: string
          enum:
          - MALE
          - FEMALE
          - OTHER
        birthDate:
          type: string
          format: date
        position:
          maxLength: 80
          minLength: 0
          pattern: "^\\s*[\\p{L}\\p{N}][\\p{L}\\p{N} .,&/()'\\-]*$"
          type: string
        active:
          type: boolean
    ApiError:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
          format: int32
        error:
          type: string
        message:
          type: string
        path:
          type: string
        validationErrors:
          type: array
          items:
            $ref: '#/components/schemas/FieldValidationError'
    FieldValidationError:
      type: object
      properties:
        field:
          type: string
        message:
          type: string
    EmployeeRequest:
      required:
      - age
      - birthDate
      - firstName
      - gender
      - lastName
      - position
      type: object
      properties:
        firstName:
          maxLength: 50
          minLength: 0
          pattern: "^\\s*\\p{L}+(?:[ '\\-]\\p{L}+)*\\s*$"
          type: string
        middleName:
          maxLength: 50
          minLength: 0
          pattern: "^\\s*$|^\\s*\\p{L}+(?:[ '\\-]\\p{L}+)*\\s*$"
          type: string
        lastName:
          maxLength: 50
          minLength: 0
          pattern: "^\\s*\\p{L}+(?:[ '\\-]\\p{L}+)*\\s*$"
          type: string
        secondLastName:
          maxLength: 50
          minLength: 0
          pattern: "^\\s*$|^\\s*\\p{L}+(?:[ '\\-]\\p{L}+)*\\s*$"
          type: string
        age:
          maximum: 100
          minimum: 18
          type: integer
          format: int32
        gender:
          type: string
          enum:
          - MALE
          - FEMALE
          - OTHER
        birthDate:
          type: string
          format: date
        position:
          maxLength: 80
          minLength: 0
          pattern: "^\\s*[\\p{L}\\p{N}][\\p{L}\\p{N} .,&/()'\\-]*$"
          type: string
        active:
          type: boolean
    EmployeeResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        firstName:
          type: string
        middleName:
          type: string
        lastName:
          type: string
        secondLastName:
          type: string
        age:
          type: integer
          format: int32
        gender:
          type: string
          enum:
          - MALE
          - FEMALE
          - OTHER
        birthDate:
          type: string
          format: date
        position:
          type: string
        createdAt:
          type: string
          format: date-time
        active:
          type: boolean
    TokenRequest:
      required:
      - password
      - username
      type: object
      properties:
        username:
          type: string
        password:
          type: string
    TokenResponse:
      type: object
      properties:
        accessToken:
          type: string
        tokenType:
          type: string
        expiresIn:
          type: integer
          format: int64
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
